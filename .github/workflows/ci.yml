name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, auditorias e build publico
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backup shell scripts
        shell: bash
        run: |
          bash -n scripts/backup/backup.sh
          bash -n scripts/backup/restore-test.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Auditoria de invariantes
        run: pnpm audit:invariants

      - name: Auditoria de render publico
        run: pnpm audit:render

      - name: Build do app publico
        run: pnpm build
