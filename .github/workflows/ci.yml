name: CI

on:
  push:
    branches:
      - main
  # Roda em TODA pull request, inclusive PRs EMPILHADAS (base != main). Antes o
  # filtro `branches: [main]` fazia uma PR cuja base era outra branch (ex.: a #79
  # empilhada sobre a #78) NAO disparar o workflow — nenhuma execucao ficava
  # associada ao commit. Sem filtro de base, toda PR do repo executa a CI.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, auditorias e build publico
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODOS os .sh versionados. Estes scripts so executam em producao (cron e
      # systemd timer), entao um erro de sintaxe nao aparece em nenhum teste --
      # aparece no host, com o job nunca rodando. `catalog-cycle-with-alert.sh`
      # ficou de fora deste gate ate 2026-08 mesmo sendo o ExecStart= de
      # `cinerie-catalog-cycle.service`. Ao adicionar um .sh, adicione aqui.
      - name: Validate operational shell scripts
        shell: bash
        run: |
          expected=8
          found="$(git ls-files '*.sh' | wc -l)"
          if [[ "$found" -ne "$expected" ]]; then
            echo "::error::ha $found script(s) .sh versionado(s), mas este gate cobre $expected. Adicione o novo script ao 'bash -n' abaixo e atualize 'expected'." >&2
            git ls-files '*.sh' >&2
            exit 1
          fi
          bash -n scripts/backup/backup.sh
          bash -n scripts/backup/restore-test.sh
          bash -n scripts/backup/backup-with-alert.sh
          bash -n scripts/backup/verify-backup-restore.sh
          bash -n scripts/catalog/catalog-cycle-with-alert.sh
          bash -n scripts/backup/restore-test-selftest.sh
          # O /bin/sh das imagens de servico: quem o interpreta e o dash, nao o bash.
          dash -n scripts/container/pid1-shell.sh
          # O install das imagens, com nova tentativa: tambem roda sob dash.
          dash -n scripts/container/pnpm-install.sh
          awk -v tables_out=/dev/null -v rows_out=/dev/null \
            -v indexes_out=/dev/null -v constraints_out=/dev/null \
            -f scripts/backup/lib/dump-manifest.awk </dev/null

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://screen:screen@localhost:5432/screen
        run: corepack pnpm --filter @screena/db db:generate

      - name: Typecheck
        run: pnpm typecheck

      # O tsconfig principal EXCLUI persistence/**, bin/** e composition.ts (eles
      # dependem do Prisma Client gerado). Era exatamente essa regiao — o wiring
      # real — onde erros de assinatura passavam ate o runtime. Este gate a
      # compila; roda depois do db:generate, que e o motivo da exclusao original.
      - name: Typecheck do wiring operacional (persistence/, bin/, composition)
        run: pnpm typecheck:catalog-runtime

      # Gate de tipo das APLICACOES (baseline R-05). O `pnpm typecheck` acima
      # cobre packages/api-clients/services/tests, mas NAO apps/**: web so era
      # verificado indiretamente por `next build` e admin nao tinha gate algum.
      # Roda depois do db:generate porque ambos os apps consomem @screena/db
      # (que reexporta o Prisma Client gerado).
      - name: Typecheck do app publico (web)
        run: pnpm typecheck:web

      - name: Typecheck do admin
        run: pnpm typecheck:admin

      # O CMS editorial (Payload) e uma aplicacao ISOLADA: banco proprio, sem
      # Prisma e sem @screena/db. Typecheck e teste proprios porque o `vitest`
      # da raiz nao alcanca `apps/**` e porque o stack do Payload fixa uma
      # versao de Next DIFERENTE da de apps/web (ver apps/cms/README.md).
      - name: Typecheck do CMS editorial (Payload)
        run: pnpm typecheck:cms

      - name: Testes do CMS editorial (nucleo puro, sem banco)
        run: pnpm test:cms

      # Integracao REAL do CMS: sobe PostgreSQL 16 efemero, aplica as migrations
      # do Payload pelo CLI oficial, faz `next build` + `next start` numa porta
      # livre e bate no servidor por HTTP. Cria identidades e API keys
      # TEMPORARIAS no proprio banco descartavel — sem EasyPanel, sem screen-db,
      # sem DATABASE_URL e sem credencial real. Existe porque os testes puros
      # nao conseguem provar que a governanca esta LIGADA: autenticacao por API
      # key, access control, hooks, outbox e rollback so aparecem no runtime.
      #
      # Inclui a QUOTA de autopublicacao sob concorrencia real (transacoes
      # simultaneas disputando o mesmo contador) e o rollback que garante que
      # contador e publicacao vivem e morrem juntos. Nenhum dos dois aparece em
      # teste puro: um teste sequencial nunca dispara a corrida que o contador
      # existe para vencer.
      - name: Integracao do CMS editorial (Payload + PostgreSQL 16 efemero)
        run: pnpm test:cms:integration

      # Projecao editorial CMS -> banco publico, com DOIS PostgreSQL 16
      # efemeros ao mesmo tempo (o do Payload e o do screen-db). Prova o que
      # nenhum dos dois lados prova sozinho: escopo da conta tecnica, lease
      # exclusiva sob dois workers concorrentes, replay idempotente, evento
      # fora de ordem, sanitizacao do erro que chega ao painel e retratacao que
      # tira do indice sem apagar a materia.
      #
      # Nenhuma credencial real, nenhum banco real: contas e chaves nascem e
      # morrem dentro dos bancos descartaveis.
      - name: Integracao da projecao editorial (dois PostgreSQL 16 efemeros)
        run: pnpm test:publication-projection:integration

      # Gate DEDICADO da midia editorial: mesmo cenario (CMS real, dois
      # PostgreSQL 16 efemeros, storage local temporario), filtrado aos casos de
      # midia. E um recorte do gate acima, nao uma segunda infraestrutura —
      # subir outro CMS e outros dois bancos custaria ~5 minutos de CI para
      # exercitar exatamente o mesmo caminho.
      #
      # Prova: bytes reais atravessam o endpoint interno, sao validados por
      # assinatura, gravados em disco por chave derivada do conteudo e lidos de
      # volta; licenca, finalidade e atribuicao barram o que deve barrar; e
      # nenhuma URL http chega ao banco publico.
      - name: Integracao da midia editorial (storage local + dois PG16)
        run: pnpm test:editorial-media-projection:integration

      # CAMINHO EDITORIAL HUMANO (FASE 2G). Gate NOMEADO, apontando so para o
      # caminho manual: quando ele falha, a mensagem ja diz que o problema e da
      # redacao humana, e nao da autopublicacao. O arquivo tambem roda dentro de
      # `test:cms:integration`; aqui ele volta isolado de proposito, porque um
      # gate generico vermelho nao responde "o CMS manual quebrou?".
      #
      # Prova, contra Next + Payload + PostgreSQL 16 efemeros: publicacao SOLO
      # de administrador e editor-chefe, rastro createdBy/updatedBy/publishedBy
      # derivado da sessao (nunca do corpo), autor publico != usuario do CMS,
      # corpo e SEO manuais, midia licenciada, e — o ponto da fase — publicacao
      # SEM nenhum campo, credencial ou variavel do MNScr, com `/healthz` e
      # `/readyz` em 200 nesse mesmo ambiente.
      - name: Caminho editorial humano (CMS manual sem MNScr)
        run: pnpm test:manual-editorial:integration

      # PAINEL REAL, NAVEGADOR REAL. Chromium ja instalado na imagem do runner
      # via `playwright install --with-deps chromium` (passo abaixo). Cobre o
      # que nenhuma chamada HTTP prova: que as oito abas existem na tela, que o
      # rascunho salva por autosave, que o campo de automacao chega desabilitado
      # e que o botao generico "Publish changes" do Payload NAO burla o fluxo
      # editorial.
      - name: Instalar Chromium para o E2E do painel
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E do painel editorial manual (Playwright)
        run: pnpm test:manual-editorial:e2e

      # CANARIO PONTA A PONTA da publicacao MANUAL: humano -> Payload -> outbox
      # -> worker -> screen-db -> presenter publico -> JSON-LD, sitemap pt-BR e
      # News Sitemap. Dois PostgreSQL 16 efemeros e storage temporario.
      #
      # E o unico gate que fecha o circuito inteiro: os demais provam pedacos.
      # Ele aborta se qualquer `MNSCR_*`/`EDITORIAL_AUTO_PUBLISH_*` estiver no
      # ambiente — um canario que rodasse com automacao ligada nao provaria a
      # independencia que ele existe para provar.
      - name: Canario da publicacao manual ate a pagina publica
        run: pnpm test:manual-publication-projection:integration

      # SEGUNDA METADE da mesma cadeia, e uma pergunta diferente. O canario
      # acima segue UMA materia com UM vinculo ate a pagina de filme, o JSON-LD
      # e os sitemaps: prova que a publicacao chega ao ar. Este aqui prova o
      # trecho de `entity_news_links` para diante, onde cada superficie aplica o
      # proprio gate depois do vinculo — filme, serie, pessoa, Home e
      # `/noticias` —, mais reconciliacao de vinculo removido, materia hibrida
      # nas duas verticais, retratacao sumindo das cinco superficies e replay
      # deliberado do evento antigo que nao ressuscita a retratada.
      #
      # Os dois convivem: nenhum substitui o outro.
      - name: Canario dos vinculos editoriais ate as superficies publicas
        run: pnpm --filter @screena/web canary:editorial-entity-links

      # MESMA cadeia, pela porta da AUTOMACAO. Os dois canarios acima entram
      # pelo caminho humano — o de vinculos ate se recusa a rodar com
      # `EDITORIAL_AUTO_PUBLISH_*` no ambiente. Este entra pelo endpoint do
      # MNScr e mede o trecho que ninguem media: o limiar de confianca do
      # ADR 0019 separando, DE PONTA A PONTA, o vinculo que atravessa
      # (`tmdb_id`, 1.0) do que espera humano (`exact_name`, 0.85) — ate
      # `entity_news_links`, ate a ficha do filme e ate a vertical da Home.
      #
      # Era exatamente aqui que morava o defeito: `201` na resposta, ids certos,
      # `entity_news_links` vazio e nenhum erro em lugar nenhum.
      - name: Canario da auto-verificacao de vinculo por confianca (automacao)
        run: pnpm --filter @screena/web canary:entity-link-auto-verification

      # ROTA INTERNA DE RESOLUCAO DE ENTIDADE, com Next REAL e PostgreSQL 16
      # efemero. Passo proprio porque o que ele prova nao aparece em teste puro:
      # o SQL de casamento por titulo (`immutable_unaccent` e
      # `string_to_array(normalized_aliases,'|')` so existem no banco), a
      # credencial e o teto LIGADOS no handler, os cabecalhos de rota interna
      # (`X-Robots-Tag`, `no-store`, ausencia de CORS) e o `405`.
      #
      # O ultimo passo e o que justifica o custo: ele pega o id que a ROTA
      # devolveu, poe num bloco `entityCard` e renderiza pela mesma funcao da
      # pagina publica. Se a ficha nao aparecer, o bloco teria sumido em
      # silencio — que e exatamente o defeito que a rota existe para fechar.
      #
      # Chave sorteada no processo; nenhuma credencial real.
      - name: Rota interna de resolucao de entidade (Next real + PostgreSQL 16 efemero)
        run: pnpm --filter @screena/web validate:entity-resolve

      # PRONTIDAO DE IMPLANTACAO. Nao sobem banco nem container: provam a
      # POLITICA que decide se um servico pode ser promovido — migration
      # pendente bloqueia, schema publico atrasado bloqueia, storage sem
      # persistencia declarada em producao e recusado, credencial e caminho
      # nunca aparecem em mensagem de erro, e trocar o driver de storage nao
      # muda os bytes entregues.
      #
      # Sao rapidos de proposito: rodam a cada push, antes dos gates caros.
      - name: Prontidao de implantacao do CMS
        run: pnpm test:cms:deployment-readiness

      - name: Prontidao de implantacao do worker de projecao
        run: pnpm test:publication-worker:deployment-readiness

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Estilo COMPUTADO da camada publica, em Chromium de verdade. Nao entra
      # em `pnpm test` porque o vitest da raiz roda em `environment: node` e
      # jsdom nao tem folha de estilo de UA — o defeito que este gate pega (o
      # `buttonface` do navegador atras da aba) passaria verde la.
      - name: Instalar Chromium para os testes de estilo
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de estilo computado (vazamento de padrao do navegador)
        run: pnpm test:styles

      - name: Auditoria de invariantes
        run: pnpm audit:invariants

      - name: Auditoria de render publico
        run: pnpm audit:render

      - name: Cobertura de API — Fase 5 (drift do registry vs codigo)
        run: pnpm api:coverage

      - name: Build do app publico
        run: pnpm build

      # BUILD DO ADMIN. Ele tem 11 paginas — entre elas `review-queue` e
      # `content-blocks/[id]`, a UNICA tela onde um humano revisa bloco
      # editorial — e nunca foi construido por nada: nem aqui, nem por
      # Dockerfile. Um app que nao e compilado em CI quebra na primeira vez que
      # alguem tenta implanta-lo, que e o pior momento possivel para descobrir.
      #
      # `DATABASE_URL` inalcancavel de proposito: o admin nao tem
      # `generateStaticParams`, entao nenhuma pagina precisa do banco para
      # compilar — e se alguma tentar, ela FALHA aqui em vez de tocar um banco.
      - name: Build do painel interno (admin)
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/screena_build
        run: pnpm build:admin

      # PAINEL OPERACIONAL com Next REAL sobre o build acima e PostgreSQL 16
      # efemero: cada numero confere com o banco e muda quando ele muda, todo
      # vermelho tem controle negativo, a cobertura em SQL bate com os portoes da
      # pagina linha a linha, 401 sem credencial e noindex por requisicao, zero
      # segredo no HTML e no log, e o botao de forcar ENFILEIRA sem colidir com o
      # agendador.
      - name: Painel operacional (Next real do admin, PostgreSQL 16 efemero)
        run: pnpm --filter @screena/admin validate:ops-panel

      - name: Validadores descartaveis (PostgreSQL efemero, sem banco remoto)
        run: pnpm --filter @screena/web validate:all

      # Cache de rota e VOLUME de consulta, com Next REAL sobre o build acima.
      # Precisa vir DEPOIS do `pnpm build`: o script sobe `next start`, mede o
      # `Cache-Control` que o Next emite por classe de rota e conta as linhas
      # lidas por requisicao com `pg_stat_statements`.
      - name: Cache de rota + orcamento de linhas (Next real, PostgreSQL 16 efemero)
        run: pnpm --filter @screena/web validate:route-cache

      - name: Migration Fase 2 — Cenario A (do zero, PostgreSQL 16 efemero)
        run: pnpm --filter @screena/db db:validate:real

      - name: Migration Fase 2 — Cenario B (upgrade sobre estado anterior)
        run: pnpm --filter @screena/db db:validate:upgrade

      # pgcrypto sob search_path hostil (baseline R-03). Este validador foi
      # escrito para o incidente de producao do PR #73 (digest() fora do schema
      # public) e existia sem nunca rodar em lugar nenhum — a regressao podia
      # voltar sem sinal. Agora e gate de CO.
      - name: Migration — pgcrypto sob search_path hostil (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/db db:validate:pgcrypto

      - name: Stores de streaming — integracao (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/streaming validate:stores

      - name: SEO runtime — Fase 3, fonte unica (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/web validate:seo-runtime

      - name: Rotas temporada/episodio — Fase 4 (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/web validate:season-episode-routes

      - name: Plataforma TMDB — Fases 6-8 (catalogo, midia, discovery; PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ingestion validate:tmdb-platform

      - name: Plataforma de catalogo Backend A — jobs + busca (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ingestion validate:catalog-platform-complete

      - name: Produtor de page_indexability_decisions (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ingestion validate:indexability-producer

      # Recuperacao de sinopse/biografia do bloco `translations` + o teto do
      # censo. Semeia 100.001 filmes (um a mais que o antigo default de
      # `100_000`) para provar que o censo soma o total real e que um `--limit`
      # se declara truncado. Roda depois do produtor porque exercita o mesmo.
      - name: Recuperacao de texto e teto do censo (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ingestion validate:text-recovery

      # O elo que o validador acima NAO cobre: entre a coluna e o HTML ainda ha
      # loader, presenter e componente. Renderiza a rota real e procura o texto
      # no corpo da pagina (fora do JSON-LD).
      - name: Sinopse recuperada aparece no HTML da ficha (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/web validate:synopsis-render

      - name: Integridade do catalogo — backfill, midia, unicidade (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ingestion validate:catalog-integrity

      - name: Plataforma externa e inteligencia (Fases 9-11; PostgreSQL 16 efemero)
        run: pnpm validate:external-intelligence-platform

      - name: Backend B — ratings, streaming, licencas e Cinerie Score (PostgreSQL 16 efemero)
        run: pnpm validate:external-intelligence-product

      - name: Autorizacao de fontes e atribuicao (registro governado; PostgreSQL 16 efemero)
        run: pnpm validate:source-authorization-and-attribution

      # A ORDEM em que os titulos entram na fila da OMDb, medida pelo que o
      # Postgres devolve — nao pelo texto do SQL. Um `expect(sql).toContain(...)`
      # passaria com a clausula presente e os indices de parametro trocados.
      - name: Ordem e particao dos candidatos OMDb (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ratings validate:omdb-order

      # O SIGTERM do desligamento no meio de um lote da OMDb, com processo de
      # verdade: a CLI spawnada como o agendador a spawna para entre requisicoes e
      # grava a linha `aborted` com a cota que o servidor falso RECEBEU. Controle
      # negativo: sem a parada cooperativa o processo morre e a linha nao existe.
      # So roda inteiro em POSIX (no Windows nao ha SIGTERM) — por isso vive aqui.
      - name: Parada cooperativa da CLI OMDb no SIGTERM (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ratings validate:omdb-shutdown

      # O IRMAO do passo acima, para o OUTRO jeito de o lote morrer antes da
      # linha autoritativa: um erro INESPERADO (aqui, `api_cache` saindo de baixo
      # do processo com a requisicao em voo). O `catch` da CLI grava a linha
      # `aborted`, e ela precisa levar a cota JA emitida — senao `readSpentToday`
      # soma NULL como zero e o dia fica subcontado. Controle negativo: a mesma
      # CLI com as duas linhas do conserto removidas da fonte grava NULL.
      - name: Cota do lote OMDb abortado por erro inesperado (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/ratings validate:omdb-unexpected-error

      # Backend D - cadeia editorial: fonte -> item recebido -> proveniencia ->
      # artigo -> publicacao -> projecao publica. Prova, entre outras coisas,
      # que rascunho, materia AGENDADA e materia retratada nunca entram na
      # busca nem no indice, e que a reingestao e idempotente.
      - name: Backend D - editorial, news e publication (PostgreSQL 16 efemero)
        run: pnpm validate:editorial-platform

      # Backend C tem DOIS validadores de PostgreSQL real, com coberturas
      # DISJUNTAS — por isso sao dois passos, e nao um. O de @screena/db prova a
      # MIGRATION (constraints, indices parciais, backfill, upgrade); o de
      # @screena/user-platform prova os ADAPTERS (o que o driver reporta, o
      # compare-and-swap sob concorrencia, o rollback do cadastro). Rodar so um
      # deixaria metade do Backend C verde sem ter sido executada.
      - name: Backend C — migration C7A/C7A.1 (recomendacoes e identidade de tracking; PostgreSQL 16 efemero)
        run: pnpm --filter @screena/db db:validate:user-persistence

      # Este e o passo que cobre AUTENTICACAO (identidade, credencial, sessao,
      # token e throttle). O passo acima NAO cobre auth, apesar do nome do
      # pacote: ele valida recomendacoes e tracking. Nomear qualquer um dos dois
      # como "user platform persistence" generico esconderia essa fronteira.
      - name: Backend C — adapters C7B1 (identidade, credencial, sessao, token e throttle; PostgreSQL 16 efemero)
        run: pnpm --filter @screena/user-platform validate:user-product

      # C7D cobre o que os dois passos acima NAO cobrem: os adapters de PERFIL,
      # CONSENTIMENTO, PEDIDOS LGPD, AUDITORIA e CICLO DE VIDA da conta, mais o
      # RUNTIME completo ponta a ponta (cadastro -> login -> perfil ->
      # consentimento -> exportacao -> troca de senha -> encerramento ->
      # anonimizacao). Prova em Postgres real o CHECK status/deleted_at, o
      # TRIGGER append-only de auditoria, o CAS de status sob concorrencia e que
      # a exportacao NUNCA carrega segredo. Passo separado por cobrir uma
      # fronteira disjunta das outras duas.
      - name: Backend C — identidade e privacidade C7D (perfil, consentimento, LGPD, sessao; PostgreSQL 16 efemero)
        run: pnpm --filter @screena/user-platform validate:identity-privacy

      # C8 cobre a BIBLIOTECA PESSOAL — watchlist, tracker de series, listas,
      # notas e importacao —, que os tres passos acima nao tocam. Prova em
      # Postgres real: os CHECKs e as FKs polimorficas para entities, o unique
      # parcial das listas de sistema, o CAS sob concorrencia, uma serie com
      # milhares de episodios em UMA operacao, a exportacao LGPD com os dados
      # novos e o encerramento EXECUTANDO a retencao de product_content.
      - name: Backend C — biblioteca, tracker e importacao C8 (PostgreSQL 16 efemero)
        run: pnpm --filter @screena/user-platform validate:library

  # Prova REAL de backup + restore (Prompt 02). Roda os scripts ENVIADOS
  # (backup.sh/restore-test.sh) contra um PostgreSQL 16 de verdade, com
  # pg_dump/pg_restore/psql 16, e compara contagens de dados origem == restaurado.
  # NAO e checagem de sintaxe (essa fica no job acima). Job separado por precisar
  # de um servico Postgres e do cliente 16.
  backup-restore:
    name: Backup + restore real (fidelidade de dados, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: screen
          POSTGRES_PASSWORD: screen
          POSTGRES_DB: screen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U screen -d screen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://screen:screen@localhost:5432/screen
      # Base administrativa isolada (o proprio 'postgres' db) para criar/dropar
      # as bases efemeras de restore. Nunca aponta para a origem.
      RESTORE_TEST_ADMIN_URL: postgresql://screen:screen@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pg_dump/pg_restore/psql versao 16 (casa com o servico). O runner ja traz
      # o repo PGDG; garantimos o cliente 16 explicitamente.
      - name: Instalar postgresql-client 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
          pg_dump --version
          psql --version

      - name: Generate Prisma Client
        run: pnpm --filter @screena/db db:generate

      - name: Aplicar migrations + seed na origem
        run: |
          pnpm --filter @screena/db db:migrate:deploy
          pnpm --filter @screena/db db:seed

      - name: Verificar backup + restore com fidelidade de dados
        run: bash scripts/backup/verify-backup-restore.sh

      # CONTROLE NEGATIVO do passo acima. Um teste de restore que nunca fica
      # vermelho nao prova restore nenhum: aqui o `restore-test.sh` roda cinco
      # vezes contra o mesmo dump — uma limpa (precisa sair 0) e quatro com uma
      # divergencia injetada na base restaurada (linha, tabela, indice, FK), cada
      # uma precisando sair != 0 COM o diagnostico correspondente. Se a
      # comparacao virar decoracao de novo, este passo reprova.
      - name: Controle negativo — restore-test.sh precisa REPROVAR com divergencia
        run: bash scripts/backup/restore-test-selftest.sh

  # Prova REAL da imagem Docker (Prompt 02): constroi pelo digest declarado,
  # injeta SHA/versao/horario, sobe PostgreSQL 16, roda o container como NAO-root,
  # aguarda o HEALTHCHECK e valida HTTP + versao + migrations + gravabilidade.
  # Falha se o digest nao existir, o container nao iniciar, o healthcheck falhar
  # ou houver erro de permissao.
  docker-image:
    name: Imagem Docker real (digest, nao-root, healthcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rede Docker + PostgreSQL 16
        run: |
          set -euo pipefail
          docker network create cinerie-ci
          docker run -d --name pg --network cinerie-ci \
            -e POSTGRES_USER=screen -e POSTGRES_PASSWORD=screen -e POSTGRES_DB=screen \
            postgres:16-alpine
          # PRONTO PELO TCP, nao pelo socket. Durante o init a imagem postgres sobe um
          # servidor TEMPORARIO que so escuta o socket; `pg_isready` por ali respondia
          # "pronto" antes de o banco existir, e o psql abaixo falhava com
          # `database "screen" does not exist` (visto na CI da PR #300). O servidor
          # temporario nao abre TCP: pronto no 127.0.0.1 e o servidor definitivo.
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -h 127.0.0.1 -U screen -d screen >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec pg psql -U screen -d screen -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;"

      - name: Build da imagem (digest declarado + build args)
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CINERIE_BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          # Sem --build-arg NODE_IMAGE: usa o DIGEST default do Dockerfile. Se o
          # digest nao existir mais, o build falha aqui (desejado).
          docker build \
            --build-arg CINERIE_BUILD_SHA="${GITHUB_SHA}" \
            --build-arg CINERIE_BUILD_VERSION="ci-${GITHUB_RUN_NUMBER}" \
            --build-arg CINERIE_BUILD_TIME="${BUILD_TIME}" \
            -t cinerie-web:ci .

      - name: Subir container (nao-root) e aguardar HEALTHCHECK
        run: |
          set -euo pipefail
          docker run -d --name web --network cinerie-ci \
            -e DATABASE_URL=postgresql://screen:screen@pg:5432/screen \
            -e CINERIE_PUBLIC_SITE_URL=http://localhost:3000 \
            -e CINERIE_PUBLIC_INDEXING_ENABLED=0 \
            -p 3000:3000 cinerie-web:ci
          status=starting
          for i in $(seq 1 80); do
            status="$(docker inspect --format '{{.State.Health.Status}}' web 2>/dev/null || echo starting)"
            echo "healthcheck: ${status}"
            if [ "${status}" = "healthy" ]; then break; fi
            if [ "${status}" = "unhealthy" ]; then echo '== container unhealthy =='; docker logs web; exit 1; fi
            sleep 3
          done
          if [ "${status}" != "healthy" ]; then echo '== healthcheck nao ficou healthy =='; docker logs web; exit 1; fi

      - name: Assertivas — HTTP, versao, nao-root, migrations, gravabilidade
        run: |
          set -euo pipefail
          # 1) /api/health 200 + versao casa com os build args.
          #    URL CANONICA com barra final: `trailingSlash: true` faz
          #    /api/health responder 308 -> /api/health/. Sem -L (ou sem a barra)
          #    o curl imprimiria o corpo do redirect, nao o JSON.
          H="$(curl -fsSL http://localhost:3000/api/health/)"; echo "health=${H}"
          echo "${H}" | grep -q '"status":"ok"'
          echo "${H}" | grep -q '"database":"ok"'
          echo "${H}" | grep -q "\"commit\":\"${GITHUB_SHA}\""
          echo "${H}" | grep -q "\"version\":\"ci-${GITHUB_RUN_NUMBER}\""
          # 2) /pt/ 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/pt/)" = "200"
          # 3) /dev/movie-page-preview/ 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dev/movie-page-preview/)" = "404"
          # 4) container NAO-root
          uid="$(docker exec web id -u)"; echo "container uid=${uid}"
          test "${uid}" != "0"
          # 5) migrations aplicadas
          n="$(docker exec pg psql -U screen -d screen -tAc 'SELECT count(*) FROM "_prisma_migrations"')"
          echo "migrations=${n}"; test "${n}" -ge 1
          # 6) diretorios do Next gravaveis pelo usuario do container
          docker exec web sh -c 'mkdir -p /app/apps/web/.next/cache && touch /app/apps/web/.next/cache/__probe && rm /app/apps/web/.next/cache/__probe'
          echo "OK: imagem real validada (nao-root, healthcheck, HTTP, migrations, gravabilidade)."

      # A MESMA IMAGEM RODA O AGENDADOR (`screen-cron` = esta imagem + outro
      # comando). Ate 16/09/2026 o HEALTHCHECK sondava fixo a porta 3000, que so o
      # site serve: o container do agendador nunca ficava saudavel e o
      # orquestrador o substituia em loop (129 containers numa hora), matando no
      # meio todo lote longo. Este passo e a prova com o DOCKER avaliando o
      # HEALTHCHECK: antes do conserto ele terminaria em `unhealthy`.
      #
      # DRY-RUN (sem CINERIE_SCHEDULER_APPLY, NODE_ENV=test) e token FALSO, como
      # `services/sync/scripts/prove-scheduler-service.ts`: o agendador usa so o
      # PostgreSQL descartavel deste job e nao chama fornecedor nenhum.
      - name: Agendador na mesma imagem — o HEALTHCHECK segue o comando do container
        run: |
          set -euo pipefail
          probe='node /app/scripts/healthcheck/container-health.mjs; echo "exit=$?"'

          # Controle negativo 1: sem o comando do agendador e sem nada ouvindo, o
          # alvo e o do SITE, e ele REPROVA.
          out="$(docker run --rm cinerie-web:ci sh -c "${probe}")"; echo "${out}"
          echo "${out}" | grep -q 'unhealthy screen-app (padrao) http://127.0.0.1:3000/api/health/'
          echo "${out}" | grep -q '^exit=1$'

          # Controle negativo 2: com o comando do agendador no PID 1 e nada ouvindo,
          # o alvo e o /healthz do agendador, e ele REPROVA.
          out="$(docker run --rm cinerie-web:ci sh -c ": scheduler:start; ${probe}")"; echo "${out}"
          echo "${out}" | grep -q 'unhealthy screen-cron (pid1) http://127.0.0.1:3005/healthz'
          echo "${out}" | grep -q '^exit=1$'

          # O agendador de verdade, com o comando do servico embrulhado como o
          # EasyPanel embrulha: o PID 1 medido no screen-cron em 17/09/2026 e
          # `/bin/sh -c corepack pnpm --filter @screena/sync scheduler:start`, e ele
          # NAO passou pelo ENTRYPOINT da imagem (sem `PWD` no ambiente — calibrado no
          # passo seguinte). Por isso `--entrypoint`, e nao argumentos depois da imagem.
          docker run -d --name sched --network cinerie-ci \
            -e DATABASE_URL=postgresql://screen:screen@pg:5432/screen \
            -e TMDB_READ_ACCESS_TOKEN=token-de-prova-nao-e-credencial \
            -e NODE_ENV=test \
            -e CINERIE_SCHEDULER_WORKER_ID=ci-healthcheck \
            --entrypoint /bin/sh \
            cinerie-web:ci -c 'corepack pnpm --filter @screena/sync scheduler:start'
          status=starting
          for i in $(seq 1 80); do
            status="$(docker inspect --format '{{.State.Health.Status}}' sched 2>/dev/null || echo starting)"
            running="$(docker inspect --format '{{.State.Running}}' sched 2>/dev/null || echo false)"
            echo "agendador: healthcheck=${status} running=${running}"
            if [ "${status}" = "healthy" ]; then break; fi
            if [ "${status}" = "unhealthy" ] || [ "${running}" != "true" ]; then
              echo '== agendador unhealthy ou parado =='
              docker inspect --format '{{json .State.Health}}' sched || true
              docker logs sched || true
              exit 1
            fi
            sleep 3
          done
          if [ "${status}" != "healthy" ]; then
            echo '== o HEALTHCHECK do agendador nao ficou healthy =='
            docker inspect --format '{{json .State.Health}}' sched || true
            docker logs sched || true
            exit 1
          fi

          # Quem o Docker sondou: a linha do log de saude nomeia servico e URL.
          docker inspect --format '{{range .State.Health.Log}}{{.Output}}{{end}}' sched \
            | grep -q 'healthy screen-cron (pid1) http://127.0.0.1:3005/healthz -> HTTP 200'
          # O site, na mesma imagem, continua sondando o proprio /api/health/.
          docker inspect --format '{{range .State.Health.Log}}{{.Output}}{{end}}' web \
            | grep -q 'healthy screen-app (padrao) http://127.0.0.1:3000/api/health/ -> HTTP 200'
          # Um processo, um sinal de vida: a medida que em producao mostrou 129.
          n="$(docker exec pg psql -U screen -d screen -tAc "SELECT count(DISTINCT instance_id) FROM service_heartbeats WHERE service_key = 'screen-cron'")"
          echo "instancias do agendador: ${n}"; test "${n}" = "1"
          echo "OK: o agendador fica saudavel na mesma imagem do site, e o site continua sondando o /api/health/."

      # O worker de projecao e provado na imagem DELE (`Dockerfile.publication-worker`),
      # porque e ela que recebe o comando do painel em producao.
      - name: Build da imagem do worker de projecao
        run: docker build -f Dockerfile.publication-worker -t cinerie-publication:ci .

      # O SIGTERM DO `docker stop` CHEGA A QUEM DRENA — no formato do EasyPanel.
      #
      # Medido em producao em 17/09/2026 (SigCgt de cada processo em /proc): o PID 1
      # do screen-cron era o dash de `/bin/sh -c corepack pnpm ...`, SEM handler de
      # SIGTERM — o kernel descarta o sinal e todo redeploy virava SIGKILL depois
      # da carencia —; o cinerie-publication-worker tem comando no painel tambem; e
      # abaixo do pnpm um `sh -c` morria sem repassar. Conserto: o /bin/sh das
      # imagens com comando no painel (scripts/container/pid1-shell.sh, um init
      # quando e o PID 1) e os scripts `*:start` com `exec node --import tsx`. As
      # regras estao em tests/operations/container-signals.test.ts; aqui se prova a
      # montagem, com um controle negativo por imagem.
      #
      # MEDE TUDO ANTES DE AFIRMAR: cada servico e parado e o desfecho anotado, e o
      # passo so reprova no fim — uma falha mostra os tres servicos de uma vez.
      # Nenhum servico alcanca fornecedor: token falso, fila vazia, CMS inalcancavel.
      - name: SIGTERM chega ao agendador e aos workers (formato do EasyPanel)
        run: |
          set -euo pipefail
          DB=postgresql://screen:screen@pg:5432
          falhas=0
          falha() { echo "::error::$*"; falhas=$((falhas + 1)); }

          # O mesmo `docker stop` para todos: carencia de 30 s, e o tempo do stop.
          parar() {
            local inicio fim
            inicio=$(date +%s%N)
            docker stop -t 30 "$1" >/dev/null
            fim=$(date +%s%N)
            echo "$1: saida=$(docker inspect -f '{{.State.ExitCode}}' "$1") stop_ms=$(( (fim - inicio) / 1000000 ))"
          }

          # `grep -q` sai no primeiro acerto; com pipefail, o `docker logs` leva SIGPIPE e
          # o pipeline devolve 141 — um acerto viraria falha. `grep -c` le tudo.
          tem_log() {
            docker logs "$1" 2>&1 | grep -c -- "$2" >/dev/null
          }

          esperar_log() {
            for _ in $(seq 1 60); do
              if tem_log "$1" "$2"; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$1")" != "true" ]; then break; fi
              sleep 2
            done
            docker logs "$1" 2>&1 | tail -n 40
            return 1
          }

          # 0) O discriminador usado em producao para saber que o painel SUBSTITUI o
          #    ENTRYPOINT: o dash exporta PWD, entao um PID 1 exec'ado pelo
          #    `docker-entrypoint.sh` o tem no ambiente, e um PID 1 posto direto pelo
          #    Docker nao. O screen-cron mediu zero; o screen-catalog-worker, um.
          subst="$(docker run --rm --entrypoint /bin/dash cinerie-web:ci -c 'tr "\0" "\n" </proc/1/environ | grep -c "^PWD=" || true')"
          mant="$(docker run --rm cinerie-web:ci /bin/dash -c 'tr "\0" "\n" </proc/1/environ | grep -c "^PWD=" || true')"
          echo "variavel de diretorio no ambiente do PID 1: entrypoint substituido [${subst}] mantido [${mant}]"
          [ "${subst}" = "0" ] || falha "com o ENTRYPOINT substituido o PID 1 nao deveria ter PWD (teve ${subst})"
          [ "${mant}" = "1" ] || falha "com o ENTRYPOINT mantido o PID 1 deveria ter PWD (teve ${mant})"

          # 1) O agendador do passo anterior. O PID 1 e o /bin/sh da imagem (um script
          #    que o dash interpreta e que fica como init), e entre ele e o node do
          #    agendador so existe o pnpm — nenhum shell.
          pid1="$(docker exec sched /bin/dash -c 'tr "\0" " " </proc/1/cmdline')"
          echo "PID 1 do agendador: ${pid1}"
          [ "${pid1}" = "/bin/dash /bin/sh -c corepack pnpm --filter @screena/sync scheduler:start " ] \
            || falha "o PID 1 do agendador nao e o /bin/sh da imagem com o comando do painel"
          cadeia="$(docker exec sched /bin/dash -c '
            alvo=
            for p in /proc/[0-9]*; do
              # este proprio script cita o binario: nao e ele que se procura
              [ "${p#/proc/}" = "$$" ] && continue
              case "$(tr "\0" " " <"$p/cmdline" 2>/dev/null)" in
                "node --import tsx bin/cinerie-scheduler.ts "*) alvo=${p#/proc/} ;;
              esac
            done
            pid=$alvo
            while [ -n "$pid" ] && [ "$pid" != 0 ]; do
              printf "%s:%s " "$pid" "$(cat "/proc/$pid/comm")"
              pid=$(cut -d" " -f4 "/proc/$pid/stat")
            done')"
          echo "cadeia do agendador ate o PID 1: ${cadeia}"
          # agendador (node) <- pnpm (node) <- PID 1. Qualquer `sh` no meio e o defeito.
          echo "${cadeia}" | grep -Eq '^[0-9]+:node [0-9]+:node 1:[^ ]+ $' \
            || falha "a cadeia do agendador nao e node <- pnpm <- PID 1: ${cadeia}"
          parar sched
          tem_log sched '"event":"scheduler_draining"' || falha "o agendador nao registrou scheduler_draining"
          tem_log sched '"event":"scheduler_stopped"' || falha "o agendador nao registrou scheduler_stopped"
          [ "$(docker inspect -f '{{.State.ExitCode}}' sched)" = "0" ] || falha "o agendador nao saiu 0 no docker stop"

          # 2) CONTROLE NEGATIVO: o MESMO comando com o dash direto no PID 1 — a imagem
          #    de antes, na pratica. O sinal nao chega: 137 depois da carencia, sem drenar.
          #    Sem isto, um passo verde nao distinguiria o conserto de um teste cego.
          docker run -d --name sched-dash --network cinerie-ci \
            -e DATABASE_URL="${DB}/screen" \
            -e TMDB_READ_ACCESS_TOKEN=token-de-prova-nao-e-credencial \
            -e NODE_ENV=test \
            -e CINERIE_SCHEDULER_WORKER_ID=ci-controle-negativo \
            --entrypoint /bin/dash \
            cinerie-web:ci -c 'corepack pnpm --filter @screena/sync scheduler:start' >/dev/null
          if esperar_log sched-dash '"event":"scheduler_started"'; then
            docker stop -t 8 sched-dash >/dev/null
            c="$(docker inspect -f '{{.State.ExitCode}}' sched-dash)"
            echo "controle negativo (dash no PID 1): saida=${c}"
            [ "${c}" = "137" ] || falha "o controle negativo deveria sair 137 (SIGKILL), saiu ${c}"
            if tem_log sched-dash '"event":"scheduler_draining"'; then
              falha "o controle negativo drenou: este passo nao distingue o conserto"
            fi
          else
            falha "o controle negativo nao subiu"
          fi

          # 3) O catalog-worker num banco NOVO (fila vazia: nenhum job chega ao TMDB) e
          #    sem enfileiradores, com o CMD da imagem dele.
          docker exec pg psql -U screen -d screen -c "CREATE DATABASE catalogo_ci;" >/dev/null
          docker exec pg psql -U screen -d catalogo_ci -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;" >/dev/null
          docker run --rm --network cinerie-ci -e DATABASE_URL="${DB}/catalogo_ci" \
            --entrypoint /bin/sh cinerie-web:ci -c 'pnpm --filter @screena/db db:migrate:deploy' >/dev/null
          docker run -d --name catalogo --network cinerie-ci \
            -e DATABASE_URL="${DB}/catalogo_ci" \
            -e TMDB_READ_ACCESS_TOKEN=token-de-prova-nao-e-credencial \
            -e NODE_ENV=test \
            -e CATALOG_WORKER_ENQUEUE_DISCOVERY=false \
            -e CATALOG_WORKER_ENQUEUE_CHANGES=false \
            cinerie-web:ci sh -c 'exec pnpm --filter @screena/ingestion catalog-worker:start' >/dev/null
          if esperar_log catalogo '"event":"catalog_service_started"'; then
            parar catalogo
            tem_log catalogo '"event":"catalog_service_draining"' || falha "o catalog-worker nao registrou catalog_service_draining"
            tem_log catalogo '"event":"catalog_service_stopped"' || falha "o catalog-worker nao registrou catalog_service_stopped"
            [ "$(docker inspect -f '{{.State.ExitCode}}' catalogo)" = "0" ] || falha "o catalog-worker nao saiu 0 no docker stop"
          else
            falha "o catalog-worker nao subiu"
          fi

          # 4) O worker de projecao na IMAGEM DELE e com o COMANDO DO PAINEL dele, lido na
          #    tela Avancado em 17/09/2026. CMS inalcancavel (porta fechada no loopback:
          #    nenhum pedido sai do container) e 60 s de espera entre ciclos, acima da
          #    carencia: so termina a tempo se o sinal CHEGAR e a espera ACORDAR com ele.
          #    O `pnpm exec` morre ao repassar o sinal (saida 143); o worker drena como
          #    orfao, e o init do /bin/sh espera por ele — a linha `parado` e a prova.
          PROJECAO_CMD='pnpm --filter @screena/news-ingestion exec tsx bin/project-editorial.ts --loop --allow-production-url'
          projecao_env=(
            -e SCREEN_DATABASE_URL="${DB}/screen"
            -e PAYLOAD_INTERNAL_SERVICE_URL=http://127.0.0.1:9/
            -e PAYLOAD_PROJECTION_API_KEY=chave-de-prova-nao-e-credencial
            -e PROJECTION_POLL_INTERVAL_MS=60000
            -e EDITORIAL_MEDIA_STORAGE_DRIVER=local
            -e EDITORIAL_MEDIA_LOCAL_ROOT=/tmp/midia-ci
            -e NODE_ENV=test
          )
          docker run -d --name projecao --network cinerie-ci "${projecao_env[@]}" \
            -e PROJECTION_WORKER_ID=ci-projecao \
            --entrypoint /bin/sh cinerie-publication:ci -c "${PROJECAO_CMD}" >/dev/null
          if esperar_log projecao 'worker=ci-projecao modo=loop'; then
            # O primeiro ciclo falha (CMS fora) e o worker entra na espera de 60 s.
            esperar_log projecao 'ciclo FALHOU' || true
            parar projecao
            tem_log projecao 'sinal recebido' || falha "o worker de projecao nao registrou o sinal"
            tem_log projecao '\[projecao\] parado' || falha "o worker de projecao nao terminou a drenagem (sem a linha parado)"
            c="$(docker inspect -f '{{.State.ExitCode}}' projecao)"
            case "${c}" in
              0 | 143) ;;
              *) falha "o worker de projecao saiu ${c} no docker stop (esperado 0 ou 143, nunca o SIGKILL)" ;;
            esac
          else
            falha "o worker de projecao nao subiu"
          fi

          # 5) CONTROLE NEGATIVO do worker de projecao: o mesmo comando do painel com o
          #    dash direto no PID 1. 137, e a drenagem nunca termina.
          docker run -d --name projecao-dash --network cinerie-ci "${projecao_env[@]}" \
            -e PROJECTION_WORKER_ID=ci-projecao-controle \
            --entrypoint /bin/dash cinerie-publication:ci -c "${PROJECAO_CMD}" >/dev/null
          if esperar_log projecao-dash 'worker=ci-projecao-controle modo=loop'; then
            docker stop -t 8 projecao-dash >/dev/null
            c="$(docker inspect -f '{{.State.ExitCode}}' projecao-dash)"
            echo "controle negativo do worker de projecao (dash no PID 1): saida=${c}"
            [ "${c}" = "137" ] || falha "o controle negativo do worker de projecao deveria sair 137, saiu ${c}"
            if tem_log projecao-dash '\[projecao\] parado'; then
              falha "o controle negativo do worker de projecao drenou: este passo nao distingue o conserto"
            fi
          else
            falha "o controle negativo do worker de projecao nao subiu"
          fi

          if [ "${falhas}" -gt 0 ]; then
            echo "${falhas} falha(s) — ver as linhas ::error:: acima"
            exit 1
          fi
          echo "OK: o SIGTERM chega ao agendador e aos dois workers; os controles negativos provam a diferenca."

      # O admin e o CMS nunca tiveram a IMAGEM construida na CI, so o `next build`
      # de cada app. Entram aqui porque o passo seguinte para os tres apps Next com
      # `docker stop` — e o CMD que o orquestrador roda so existe na imagem.
      - name: Build das imagens do admin e do CMS
        run: |
          set -euo pipefail
          docker build -f Dockerfile.admin -t cinerie-admin:ci .
          docker build -f Dockerfile.cms -t cinerie-cms:ci .

      # O SIGTERM DO `docker stop` CHEGA AO NEXT — site, admin e CMS.
      #
      # O CMD das tres imagens termina em `exec pnpm --filter <app> start`: o PID 1 e
      # o pnpm, e ele repassa o SIGTERM so ao processo que roda o script. Com `start`
      # = `next start`, esse processo era um `sh -c` que morria sem repassar: o pnpm
      # saia 1 e o Next morria junto com o container, no meio das requisicoes
      # (medido em 17/09/2026 nas imagens reais: 175-240 ms, requisicao derrubada).
      # Com `exec next start` o processo do script E o Next, que trata o sinal
      # sozinho: fecha o servidor, espera o que esta em curso e sai 0.
      #
      # A PROVA E UMA REQUISICAO EM CURSO. O PostgreSQL PAUSADO segura a requisicao
      # dentro do handler; o `docker stop` chega com ela aberta e o banco volta 3 s
      # depois. So um Next que recebeu o sinal e esperou entrega a resposta. E um
      # CONTROLE NEGATIVO por imagem: a MESMA imagem, com o `exec` tirado do `start`
      # dentro do container, tem de derrubar a requisicao e sair diferente de 0.
      #
      # Depois dos servicos de proposito: pausar o banco nao pode atingir o agendador
      # nem os workers, que pararam no passo anterior.
      - name: SIGTERM chega ao Next (site, admin e CMS)
        run: |
          set -euo pipefail
          DB=postgresql://screen:screen@pg:5432
          falhas=0
          falha() { echo "::error::$*"; falhas=$((falhas + 1)); }
          # Nenhuma saida deste passo deixa o banco congelado.
          trap 'docker unpause pg >/dev/null 2>&1 || true' EXIT

          esperar_200() {
            local url=$1
            shift
            for _ in $(seq 1 90); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "$@" "$url" || true)" = "200" ] && return 0
              sleep 2
            done
            return 1
          }

          # Do Next ate o PID 1, como `pid:comm|`. O Next se renomeia para
          # `next-server (vX)` ao subir, e o nome tem espaco: o pai sai do `stat`
          # depois do ULTIMO `) `.
          cadeia_do_next() {
            docker exec "$1" /bin/dash -c '
              alvo=
              for p in /proc/[0-9]*; do
                case "$(tr "\0" " " <"$p/cmdline" 2>/dev/null)" in "next-server "*) alvo=${p#/proc/} ;; esac
              done
              pid=$alvo
              while [ -n "$pid" ] && [ "$pid" != 0 ]; do
                read -r linha <"/proc/$pid/stat"
                printf "%s:%s|" "$pid" "$(cat "/proc/$pid/comm")"
                set -f; set -- ${linha##*) }; set +f
                pid=$2
              done'
          }

          # Tira o `exec` do `start` DENTRO do container criado — a forma de antes, na
          # MESMA imagem — e confere que a imagem tinha o `exec` a tirar.
          tirar_exec() {
            docker cp "$1:/app/$2" "/tmp/$1.json"
            jq '.scripts.start |= sub("^exec "; "")' "/tmp/$1.json" >"/tmp/$1-sem-exec.json"
            local antes depois
            antes="$(jq -r .scripts.start "/tmp/$1.json")"
            depois="$(jq -r .scripts.start "/tmp/$1-sem-exec.json")"
            echo "$1: start da imagem [${antes}] -> no controle negativo [${depois}]"
            [ "exec ${depois}" = "${antes}" ] || falha "$1: o start da imagem nao comeca com exec: ${antes}"
            docker cp "/tmp/$1-sem-exec.json" "$1:/app/$2"
          }

          # Para o container com uma requisicao em curso e anota o codigo de saida, o
          # tempo do stop e se a resposta chegou ao cliente (curl 0 + marcador no corpo).
          parar_com_requisicao() {
            local c=$1 url=$2 marcador=$3
            shift 3
            # a conexao do pool com o banco abre ANTES da pausa
            curl -s -o /dev/null "$@" "$url" || true
            docker pause pg >/dev/null
            (
              set +e
              curl -s -o "/tmp/corpo-$c" -w '%{http_code}' --max-time 60 "$@" "$url" >"/tmp/http-$c"
              echo $? >"/tmp/curl-$c"
            ) &
            local p_curl=$! p_volta inicio fim
            sleep 1
            ( sleep 3; docker unpause pg >/dev/null ) &
            p_volta=$!
            inicio=$(date +%s%N)
            docker stop -t 30 "$c" >/dev/null
            fim=$(date +%s%N)
            wait "${p_volta}" || true
            wait "${p_curl}" || true
            saida="$(docker inspect -f '{{.State.ExitCode}}' "$c")"
            entregue=nao
            if [ "$(cat "/tmp/curl-$c")" = "0" ] && grep -c -- "${marcador}" "/tmp/corpo-$c" >/dev/null; then
              entregue=sim
            fi
            echo "$c: saida [${saida}] stop_ms [$(( (fim - inicio) / 1000000 ))] curl [$(cat "/tmp/curl-$c")] http [$(cat "/tmp/http-$c")] requisicao_entregue [${entregue}]"
          }

          # O conserto: o Next e filho DIRETO do pnpm no PID 1, drena e sai 0.
          provar_conserto() {
            local rotulo=$1 c=$2 url=$3 marcador=$4 cadeia
            shift 4
            cadeia="$(cadeia_do_next "$c")"
            echo "${rotulo}: cadeia do Next ate o PID 1: ${cadeia}"
            local direto='^[0-9]+:next-server [^|]*[|]1:node[|]$'
            [[ "${cadeia}" =~ ${direto} ]] || falha "${rotulo}: o Next nao e filho direto do pnpm no PID 1: ${cadeia}"
            parar_com_requisicao "$c" "$url" "$marcador" "$@"
            [ "${saida}" = "0" ] || falha "${rotulo}: docker stop saiu ${saida} (esperado 0)"
            [ "${entregue}" = "sim" ] || falha "${rotulo}: a requisicao em curso nao chegou ao cliente — o Next nao drenou"
          }

          # O controle negativo: sem o `exec`, um shell fica entre o pnpm e o Next, o
          # sinal nao chega, e a requisicao morre com o container.
          provar_controle_negativo() {
            local rotulo=$1 c=$2 url=$3 marcador=$4
            shift 4
            echo "${rotulo} (controle negativo): cadeia do Next ate o PID 1: $(cadeia_do_next "$c")"
            parar_com_requisicao "$c" "$url" "$marcador" "$@"
            [ "${saida}" != "0" ] || falha "${rotulo}: o controle negativo saiu 0 — este passo nao distingue o conserto"
            [ "${entregue}" = "nao" ] || falha "${rotulo}: o controle negativo entregou a requisicao — este passo nao distingue o conserto"
          }

          # 1) SITE: o container `web` dos passos anteriores, com o CMD da imagem.
          provar_conserto site web http://localhost:3000/api/health/ '"database":"ok"'
          docker create --name web-sem-exec --network cinerie-ci \
            -e DATABASE_URL="${DB}/screen" \
            -e CINERIE_PUBLIC_SITE_URL=http://localhost:3100 \
            -e CINERIE_PUBLIC_INDEXING_ENABLED=0 \
            -p 3100:3000 cinerie-web:ci >/dev/null
          tirar_exec web-sem-exec apps/web/package.json
          docker start web-sem-exec >/dev/null
          if esperar_200 http://localhost:3100/api/health/; then
            provar_controle_negativo site web-sem-exec http://localhost:3100/api/health/ '"database":"ok"'
          else
            falha "o controle negativo do site nao subiu"
          fi

          # 2) ADMIN: o banco do site e o Basic Auth que o middleware exige em producao.
          admin_env=(
            -e DATABASE_URL="${DB}/screen"
            -e ADMIN_BASIC_AUTH_USER=ci
            -e ADMIN_BASIC_AUTH_PASSWORD=senha-de-prova-nao-e-credencial
          )
          admin_auth=(-u ci:senha-de-prova-nao-e-credencial)
          docker run -d --name admin --network cinerie-ci "${admin_env[@]}" -p 3006:3006 cinerie-admin:ci >/dev/null
          if esperar_200 http://localhost:3006/health "${admin_auth[@]}"; then
            provar_conserto admin admin http://localhost:3006/health 'Conectado' "${admin_auth[@]}"
          else
            falha "o admin nao subiu"
          fi
          docker create --name admin-sem-exec --network cinerie-ci "${admin_env[@]}" -p 3106:3006 cinerie-admin:ci >/dev/null
          tirar_exec admin-sem-exec apps/admin/package.json
          docker start admin-sem-exec >/dev/null
          if esperar_200 http://localhost:3106/health "${admin_auth[@]}"; then
            provar_controle_negativo admin admin-sem-exec http://localhost:3106/health 'Conectado' "${admin_auth[@]}"
          else
            falha "o controle negativo do admin nao subiu"
          fi

          # 3) CMS: banco proprio (nunca o do site), storage local declarado e as
          #    migrations do Payload, que o CMD aplica antes do start.
          docker exec pg psql -U screen -d screen -c "CREATE DATABASE cms_ci;" >/dev/null
          cms_env=(
            -e PAYLOAD_DATABASE_URL="${DB}/cms_ci"
            -e PAYLOAD_SECRET=segredo-de-prova-nao-e-credencial-0123456789
            -e PAYLOAD_UPLOAD_STORAGE_DRIVER=local
            -e PAYLOAD_UPLOAD_LOCAL_ROOT=/app/apps/cms/media
            -e PAYLOAD_UPLOAD_LOCAL_PERSISTENT_CONFIRMED=true
          )
          docker run -d --name cms --network cinerie-ci "${cms_env[@]}" \
            -e PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3002 -p 3002:3002 cinerie-cms:ci >/dev/null
          if esperar_200 http://localhost:3002/healthz; then
            provar_conserto cms cms http://localhost:3002/readyz '"service":"cinerie-cms"'
          else
            falha "o CMS nao subiu"
          fi
          docker create --name cms-sem-exec --network cinerie-ci "${cms_env[@]}" \
            -e PAYLOAD_PUBLIC_SERVER_URL=http://localhost:3102 -p 3102:3002 cinerie-cms:ci >/dev/null
          tirar_exec cms-sem-exec apps/cms/package.json
          docker start cms-sem-exec >/dev/null
          if esperar_200 http://localhost:3102/healthz; then
            provar_controle_negativo cms cms-sem-exec http://localhost:3102/readyz '"service":"cinerie-cms"'
          else
            falha "o controle negativo do CMS nao subiu"
          fi

          if [ "${falhas}" -gt 0 ]; then
            echo "${falhas} falha(s) — ver as linhas ::error:: acima"
            exit 1
          fi
          echo "OK: o Next dos tres apps recebe o SIGTERM, entrega a requisicao em curso e sai 0; sem o exec, a derruba."

      - name: Logs do container (sempre)
        if: always()
        run: |
          docker logs web 2>&1 || true
          for c in sched sched-dash catalogo projecao projecao-dash web-sem-exec admin admin-sem-exec cms cms-sem-exec; do
            echo "== ${c} =="
            docker logs "${c}" 2>&1 || true
          done
